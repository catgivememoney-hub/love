  notes: [

  /* ---------- 门 2：信 —— 三道问题，全部答对才解锁（暗号→最爱食物→中文名） ---------- */
  gateLetter: {
    title: "One last door to unlock the letter, meow!",
    steps: [
      { prompt: "Type our very first secret code.",
        answers: ["fruit cup"],                 // 输 fruit cup 或 fruitcup 都行

        answers: ["冻芒果", "红烧鲫鱼"],          // 冻芒果 或 红烧鲫鱼 任一即可

        placeholder: "Type it here",

  letter: {
    heading: "A letter for you",
    /* 👇 信在这里写，一行一段，想写多少段就加多少行。全英文。 */
    body: [
      "[生日快乐呀，我最爱的小宝贝！ 🎂✨我知道语言根本无法诠释我对你的爱，可是心里攒了太多想对你说的话，希望你能耐心看完。还记得我们初次认识的那段时间吗？我已经不记得我们为什么会玩在一起了，也忘记了是哪场对局认识的你。但我记得你给我留下了一个很好的第一印象——耐心、不压力队友、礼貌，而且声音很好听。后面退游了一段时间之后，我们又开始一起玩了。我不知道为什么会有那么多的巧合，但种种缘分让我们不停地相遇。还记得我们绑定的闺蜜标吗？我想起来了，其实是我主动绑的。不知道是出于什么心思，是遇到了一个想要一起玩的朋友，还是不知从什么时候产生的好感？我也说不清楚。第一次真正意识到我喜欢上你——第一次正视我内心的想法，是在和你在一起的几个星期之前。我有想过要不要和你表白，要不要直接当做什么都没发生，或者是尝试让你喜欢我。但最终我选择什么都不做，一如既往地和你玩。我能感觉到你好像也喜欢我，所以我时不时问你或者开几句玩笑。让我没想到的是，1月18号的那天晚上，嘴硬的你竟然承认了！于是我们顺理成章地变成了情侣。我无法诉说我当时的心情：是害怕吗？ 害怕这是一个错误的决定，害怕网恋被发现，害怕我们无法克服距离的隔阂。是开心吗？ 证实我喜欢的人也喜欢我的那一刻，充满了激动和欣喜若狂。是期待吗？ 期待我和你的未来，期待我们给对方的惊喜。还是对未知的担忧呢？ 担忧你不喜欢我、不愿意接纳或者了解真正的我。但是随着时间的推移，我也慢慢找到了答案。我们的契合程度竟然是我从未想象过的，我们有各自的思想，但在各个方面却也出奇地相似。不论是相似的爱好、性格、习惯，还是相似的经历与世界观，我们都是无比契合，并且愿意接纳对方的不同、享受彼此共同之处的两个人。我爱你，特别特别爱你。 💗这种无法诉说的爱，比昨天多一点，比明天少一点。无论你询问多少遍，我的答案都会是一样的。比昨天多一点，是因为时间带来的羁绊；比明天少一点，是因为给未来的自己留有空间。]",
      "[但不论是今天、明天，甚至是明年，我对你的爱都会一直存在。还记得我们不敢对对方表现出过度依赖的那几次吗？相信现在的你也慢慢理解了吧，我很依赖你，很黏你，想要时时刻刻和你在一起！ 不用担心你会让我厌烦，因为我和别人不一样，我是我自己。感谢你出现在我的世界里，让我曾经无感的那一部分忽然有了温度。刚在一起的那几个月，你告诉我“想到我会心口暖暖的”，那时对我来说还很难理解。可是现在我似乎明白了——因为每次想到你，那种感觉就从一个模糊抽象的概念，慢慢变成了清晰的感触。每个想到你的瞬间，都让我的心止不住地悸动，让我的脸颊发烫。在这个特别的日子里，我想把最真挚的祝福送给你：希望我的宝贝在新的一岁里，所有的烦恼都能烟消云散，所有的期待都能如期而至。不仅要快乐，还要健健康康、平安顺遂。无论遇到什么事情，你都要记得，你的身后一直有我在。我不知道我们的以后会怎么样，但我能确定我很爱很爱你。害怕失去，不想放弃你，更不想错过你。我爱你，I love you!!!!。未来的日子里，希望我们可以一起努力，或是偶尔偷懒，但永远一起朝着我们的目标前进！手拉着手，走过四季，走过漫长岁月。再次祝我最爱的小宝贝，生日快乐！]"
    ],
    signoff: "Always,",
    signName: "presley"
  },

  /* ---------- 最底部藏的一句 P.S.（想改就改，不改也行） ---------- */
  ps: "Wherever you are, look up. Same sky, always.",

  /* ---------- 互动小彩蛋（可改可留） ---------- */
  eggs: {
    // 在页面任意地方用键盘打出这个词 → 弹出一句隐藏情话（默认 jeffy）
    secretWord: "jeffy",
    secretMessage: "You found the secret. I love you, always. — presley",
    // 情话罐子多抽几次后，藏在最后的一条
    jarBonus: "And because, out of every reason, you are the whole list.",
    // 点一下那个距离数字，会变成这句
    distanceZero: "0 km. That's the distance the moment I think of you.",

    // 在【第一道进门的日期框】里打出这个 → 弹出大大的一句话
    loveYouTrigger: "iloveyou",
    loveYouMessage: "I love you too",          // 想用中文就改成：我也爱你

    // 信里出现这个词组，会变成可点击的 → 点它弹出蛋糕问题（信里记得写上这句英文）

    cakeQuestion: "Will you have a bite of my shit？?",  // 你的原话：你愿意吃我的棕色小蛋糕吗？
    cakeYes: "Yes",
    cakeNo: "No",
    cakeThanks: "下次见面给你吃."                    // 你的原话：谢谢你
  },

  /* ---------- 信后面的小聊天框：输入触发词 → 得到对应回答（5 组，自己填）----------

  chat: {
    intro: "One more thing. Ask me something — try 一些你会对我说的话，用英文说就可以啦xD.",
    placeholder: "Type something...",
    fallback: "我还没写进去怎么回答呢，message发给我，我加一个回复hehe.",
    pairs: [
      { q: "I miss you", a: "I miss you more, every single day." },
      { q: "I want to have sex with you",           a: "操死我吧，爸爸🥺" },

      { q: "I want to kiss you",           a: "[你那是吃我吧？哼，亲亲亲" },

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --cream:#EDE4D8; --paper:#F4EEE4; --latte:#D8C3A5; --caramel:#B08968;
    --coffee:#7F5539; --espresso:#4A3728; --muted:#6E5A48;
    --sage:#A3B18A; --rose:#C9ADA7; --slate:#9DA9B0;
    --line:#DBCDBB;
    --display:'Instrument Sans',system-ui,sans-serif;
    --body:'Instrument Sans',system-ui,sans-serif;
    --mono:'DM Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--cream); color:var(--espresso);
    font-family:var(--body); font-size:17px; line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--display); font-weight:500; letter-spacing:-.02em; color:var(--coffee); line-height:1.15; margin:0}
  a{color:inherit}
  ::selection{background:var(--rose); color:var(--espresso)}

  .wrap{max-width:760px; margin:0 auto; padding:0 24px}
  section{padding:88px 0}
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--caramel); margin:0 0 14px;
  }

  /* ---- reveal on scroll ---- */
  .reveal{opacity:0; transform:translateY(18px); transition:opacity .9s ease, transform .9s ease}
  .reveal.in{opacity:1; transform:none}

  /* ---- HERO ---- */
  .hero{min-height:100vh; display:flex; flex-direction:column; align-items:center;
        justify-content:center; text-align:center; padding:40px 24px}
  .heart{width:56px; height:56px; cursor:pointer; margin-bottom:26px;
         animation:beat 1.9s ease-in-out infinite; transform-origin:center}
  .heart path{fill:var(--rose)}
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.14)}28%{transform:scale(1)}42%{transform:scale(1.09)}}
  .hero h1{font-size:clamp(44px,9vw,84px)}
  .hero h1 em{font-style:italic; color:var(--caramel)}
  .hero .sub{color:var(--muted); max-width:38ch; margin:20px auto 0}
  .scrolldown{margin-top:54px; font-family:var(--mono); font-size:12px;
              letter-spacing:.2em; text-transform:uppercase; color:var(--caramel)}
  .scrolldown span{display:block; margin-top:8px; animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  /* ---- GATE (locked door) ---- */
  .gate{max-width:520px; margin:0 auto; text-align:center;
        background:var(--paper); border:1px solid var(--line);
        border-radius:18px; padding:44px 32px}
  .gate .lockicon{font-size:26px; color:var(--caramel)}
  .gate h2{font-size:30px; margin:14px 0 10px}
  .gate p.q{color:var(--muted); margin:0 0 22px}
  .gate form{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .gate input{
    flex:1 1 220px; min-width:0; font-family:var(--mono); font-size:15px;
    padding:13px 16px; border:1px solid var(--line); border-radius:12px;
    background:#fff; color:var(--espresso); outline:none; text-align:center;
  }
  .gate input:focus{border-color:var(--caramel); box-shadow:0 0 0 3px rgba(176,137,104,.18)}
  .btn{
    font-family:var(--body); font-weight:600; font-size:15px; cursor:pointer;
    padding:13px 24px; border:none; border-radius:12px;
    background:var(--coffee); color:var(--paper); transition:background .25s ease;
  }
  .btn:hover{background:var(--espresso)}
  .btn:focus-visible{outline:3px solid var(--caramel); outline-offset:2px}
  .gate .hint{margin:16px 0 0; font-size:13px; color:var(--caramel); min-height:18px}
  .shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

  .locked{display:none}          /* content hidden until its gate is passed */

  /* ---- TIMELINE ---- */
  .tl{position:relative; margin-top:12px; padding-left:26px}
  .tl::before{content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line)}
  .tl-item{position:relative; padding:0 0 40px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:""; position:absolute; left:-26px; top:7px; width:12px; height:12px;
                   border-radius:50%; background:var(--sage); border:2px solid var(--cream)}
  .tl-date{font-family:var(--mono); font-size:12px; letter-spacing:.12em; color:var(--caramel); text-transform:uppercase}
  .tl-item h3{font-size:22px; margin:5px 0 6px}
  .tl-item p{margin:0; color:var(--muted)}

  /* ---- DISTANCE & TIME ---- */
  .clocks{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:8px}
  .clock{background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:26px 22px; text-align:center}
  .clock .city{font-family:var(--display); font-size:21px; color:var(--coffee)}
  .clock .time{font-family:var(--mono); font-size:34px; color:var(--espresso); margin:8px 0 4px; letter-spacing:.02em}
  .clock .meta{font-size:13px; color:var(--muted)}
  .clock .greet{margin-top:10px; font-size:13px; color:var(--caramel); font-style:italic; font-family:var(--display)}
  .distance{text-align:center; margin-top:30px}
  .distance .km{font-family:var(--mono); font-size:clamp(30px,7vw,48px); color:var(--coffee)}
  .distance .km small{font-size:15px; color:var(--muted); letter-spacing:.04em}
  .distance .say{max-width:34ch; margin:16px auto 0; color:var(--muted); font-family:var(--display); font-style:italic; font-size:19px}

  /* ---- REASONS JAR ---- */
  .jar{background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:40px 30px; text-align:center; margin-top:8px}
  .jar .note{font-family:var(--display); font-style:italic; font-size:24px; color:var(--espresso);
             min-height:96px; display:flex; align-items:center; justify-content:center;
             transition:opacity .4s ease; padding:0 6px}
  .jar .note.fade{opacity:0}

  /* ---- COUNTDOWN ---- */
  .cd{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:8px; text-align:center}
  .cd .unit{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:22px 6px}
  .cd .num{font-family:var(--mono); font-size:clamp(26px,7vw,40px); color:var(--coffee)}
  .cd .lbl{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--caramel); margin-top:6px}
  .cd-say{text-align:center; margin-top:22px; color:var(--muted); font-family:var(--display); font-style:italic; font-size:19px}

  /* ---- LETTER ---- */
  .letter{background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:44px 38px}
  .letter h2{font-size:32px; margin-bottom:20px}
  .letter p{color:var(--espresso); margin:0 0 18px}
  .letter .sign{font-family:var(--display); font-style:italic; font-size:22px; color:var(--coffee); margin-top:26px}
  .letter .sign b{display:block; font-style:normal; font-weight:500}

  /* ---- FOOTER / PS ---- */
  footer{padding:70px 24px 90px; text-align:center}
  footer .ps{font-family:var(--mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--caramel)}
  footer .ps-text{font-family:var(--display); font-style:italic; font-size:22px; color:var(--coffee);
                  margin-top:14px; opacity:0; transform:translateY(10px); transition:opacity 1.1s ease, transform 1.1s ease}
  footer .ps-text.in{opacity:1; transform:none}

  /* ---- floating hearts easter egg ---- */
  .floater{position:fixed; bottom:-20px; font-size:22px; pointer-events:none; z-index:50;
           animation:float-up 3.4s ease-in forwards}
  @keyframes float-up{to{transform:translateY(-115vh) rotate(24deg); opacity:0}}

  /* ---- double-tap heart bloom ---- */
  .bloom{position:fixed; z-index:60; font-size:26px; color:var(--rose); pointer-events:none;
         transform:translate(-50%,-50%); animation:bloom 1.1s ease-out forwards}
  @keyframes bloom{
    0%{transform:translate(-50%,-50%) scale(0); opacity:0}
    25%{transform:translate(-50%,-60%) scale(1.25); opacity:1}
    100%{transform:translate(-50%,-150%) scale(.9); opacity:0}
  }
  /* ---- secret word overlay ---- */
  .secret-overlay{position:fixed; inset:0; z-index:70; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(74,55,40,.55); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
  .secret-overlay.show{display:flex; animation:fadein .5s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .secret-card{background:var(--paper); border:1px solid var(--line); border-radius:20px;
    padding:40px 34px; max-width:440px; text-align:center}
  .secret-card p{font-family:var(--display); font-size:23px; color:var(--coffee); margin:0 0 22px; line-height:1.45}
  .distance .km{cursor:pointer}

  /* ---- big secret message + step indicator + clickable love trigger ---- */
  .secret-card.big p{font-size:clamp(34px,10vw,62px); line-height:1.1}
  .gate .step{font-family:var(--mono); font-size:12px; letter-spacing:.18em; color:var(--caramel); margin:0 0 12px}
  .love-trigger{cursor:pointer; border-bottom:1px dashed var(--rose); transition:color .2s ease}
  .love-trigger:hover{color:var(--caramel)}

  /* ---- cake question overlay ---- */
  .cake-overlay{position:fixed; inset:0; z-index:75; display:none; align-items:center; justify-content:center;
    padding:24px; background:rgba(74,55,40,.6); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
  .cake-overlay.show{display:flex; animation:fadein .5s ease}
  .cake-card{background:var(--paper); border:1px solid var(--line); border-radius:22px; padding:44px 34px;
    max-width:460px; text-align:center; overflow:hidden}
  .cake-q{font-family:var(--display); font-size:clamp(22px,5vw,30px); color:var(--coffee); margin:0 0 28px; line-height:1.35}
  .cake-btns{display:flex; gap:16px; justify-content:center; align-items:center; min-height:64px}
  .cake-yes{transition:transform .2s ease; transform-origin:center}
  .cake-no{background:var(--paper); color:var(--coffee); border:1px solid var(--caramel); transition:transform .2s ease}
  .cake-no:hover{background:var(--cream)}

  /* ---- little chat box after the letter ---- */
  .chat{background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:28px 26px; margin-top:18px}
  .chat-intro{font-family:var(--display); font-size:19px; color:var(--coffee); margin:0 0 16px}
  .chat-log{display:flex; flex-direction:column; gap:10px; margin-bottom:16px; max-height:300px; overflow-y:auto}
  .bubble{max-width:82%; padding:10px 14px; border-radius:16px; font-size:15px; line-height:1.5}
  .bubble.you{align-self:flex-end; background:var(--coffee); color:var(--paper); border-bottom-right-radius:5px}
  .bubble.me{align-self:flex-start; background:var(--cream); color:var(--espresso); border:1px solid var(--line); border-bottom-left-radius:5px}
  .chat-row{display:flex; gap:10px}
  .chat-row input{flex:1; min-width:0; font-family:var(--body); font-size:15px; padding:12px 15px;
    border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--espresso); outline:none}
  .chat-row input:focus{border-color:var(--caramel); box-shadow:0 0 0 3px rgba(176,137,104,.18)}

  @media (max-width:560px){
    section{padding:64px 0}
    .clocks{grid-template-columns:1fr}
    .cd{grid-template-columns:repeat(2,1fr)}
    .letter{padding:34px 24px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important}
    .reveal{opacity:1; transform:none; transition:none}
    .ps-text{opacity:1; transform:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

  <!-- ===================== HERO ===================== -->
  <header class="hero">
    <svg class="heart" id="heart" viewBox="0 0 24 24" aria-label="A heart">
      <path d="M12 21s-7.5-4.9-10-9.2C.2 8.6 1.7 5 5.2 5c2 0 3.3 1.1 4 2.2C10 6.1 11.3 5 13.3 5 16.8 5 18.3 8.6 16.5 11.8 14 16.1 12 21 12 21z"/>
    </svg>
    <h1>For <em id="forName">you</em></h1>
    <p class="sub" id="heroSub"></p>
    <div class="scrolldown">scroll<span>&#8595;</span></div>
  </header>

  <!-- ===================== GATE 1: ENTRY ===================== -->
  <section id="entry">
    <div class="wrap">
      <div class="gate reveal" id="gateEntry">
        <div class="lockicon">&#9906;</div>
        <h2 id="ge-title"></h2>
        <p class="q" id="ge-prompt"></p>
        <form id="ge-form" autocomplete="off">
          <input id="ge-input" type="text" aria-label="Answer" />
          <button class="btn" type="submit">Open</button>
        </form>
        <p class="hint" id="ge-hint"></p>
      </div>
    </div>
  </section>

  <!-- Everything below stays hidden until Gate 1 is passed -->
  <div class="locked" id="afterEntry">

    <!-- ===================== TIMELINE ===================== -->
    <section id="timeline">
      <div class="wrap">
        <p class="eyebrow reveal">Our story, in order</p>
        <h2 class="reveal" style="font-size:34px; margin-bottom:8px">How we got here</h2>
        <div class="tl reveal" id="tl"></div>
      </div>
    </section>

    <!-- ===================== DISTANCE & TIME ===================== -->
    <section id="distance">
      <div class="wrap">
        <p class="eyebrow reveal">Same clock, still too far</p>
        <h2 class="reveal" style="font-size:34px; margin-bottom:18px">Where we are right now</h2>
        <div class="clocks reveal">
          <div class="clock">
            <div class="city" id="youCity"></div>
            <div class="time" id="youTime">--:--</div>
            <div class="meta" id="youMeta"></div>
          </div>
          <div class="clock">
            <div class="city" id="himCity"></div>
            <div class="time" id="himTime">--:--</div>
            <div class="meta" id="himMeta"></div>
            <div class="greet" id="himGreet"></div>
          </div>
        </div>
        <div class="distance reveal">
          <div class="km" id="km">&mdash;</div>
          <p class="say" id="distSay"></p>
        </div>
      </div>
    </section>

    <!-- ===================== REASONS JAR ===================== -->
    <section id="reasons">
      <div class="wrap">
        <p class="eyebrow reveal">Open one anytime</p>
        <h2 class="reveal" style="font-size:34px; margin-bottom:18px">Reasons, on a loop</h2>
        <div class="jar reveal">
          <div class="note" id="note">Tap the button and I'll tell you one.</div>
          <button class="btn" id="drawNote" type="button" style="margin-top:22px">Open a note</button>
        </div>
      </div>
    </section>

    <!-- ===================== COUNTDOWN ===================== -->
    <section id="countdown">
      <div class="wrap">
        <p class="eyebrow reveal">Counting down</p>
        <h2 class="reveal" style="font-size:34px; margin-bottom:18px" id="cdHead"></h2>
        <div class="cd reveal" id="cd">
          <div class="unit"><div class="num" id="cd-d">0</div><div class="lbl">days</div></div>
          <div class="unit"><div class="num" id="cd-h">0</div><div class="lbl">hours</div></div>
          <div class="unit"><div class="num" id="cd-m">0</div><div class="lbl">mins</div></div>
          <div class="unit"><div class="num" id="cd-s">0</div><div class="lbl">secs</div></div>
        </div>
        <p class="cd-say reveal" id="cdSay"></p>
      </div>
    </section>

    <!-- ===================== GATE 2: LETTER ===================== -->
    <section id="letterGate">
      <div class="wrap">
        <div class="gate reveal" id="gateLetter">
          <div class="lockicon">&#9906;</div>
          <h2 id="gl-title"></h2>
          <p class="step" id="gl-step"></p>
          <p class="q" id="gl-prompt"></p>
          <form id="gl-form" autocomplete="off">
            <input id="gl-input" type="text" aria-label="Answer" />
            <button class="btn" id="gl-btn" type="submit">Next</button>
          </form>
          <p class="hint" id="gl-hint"></p>
        </div>

        <div class="locked" id="letterWrap" style="margin-top:8px">
          <div class="letter reveal">
            <h2 id="lt-head"></h2>
            <div id="lt-body"></div>
            <div class="sign"><span id="lt-signoff"></span><b id="lt-signname"></b></div>
          </div>

          <div class="chat reveal" id="chatBox">
            <p class="chat-intro" id="chatIntro"></p>
            <div class="chat-log" id="chatLog"></div>
            <form class="chat-row" id="chatForm" autocomplete="off">
              <input id="chatInput" type="text" aria-label="Message" />
              <button class="btn" type="submit">Send</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== FOOTER / PS ===================== -->
    <footer>
      <div class="ps">P.S.</div>
      <div class="ps-text" id="psText"></div>
    </footer>

  </div><!-- /afterEntry -->

  <!-- ===================== SECRET WORD OVERLAY ===================== -->
  <div class="secret-overlay" id="secretOverlay">
    <div class="secret-card">
      <p id="secretMsg"></p>
      <button class="btn" id="secretClose" type="button">close</button>
    </div>
  </div>

  <!-- ===================== CAKE QUESTION OVERLAY ===================== -->
  <div class="cake-overlay" id="cakeOverlay">
    <div class="cake-card">
      <p class="cake-q" id="cakeQ"></p>
      <div class="cake-btns" id="cakeBtns">
        <button class="btn cake-yes" id="cakeYes" type="button">Yes</button>
        <button class="btn cake-no" id="cakeNo" type="button">No</button>
      </div>
      <button class="btn cake-close" id="cakeClose" type="button" style="display:none">close</button>
    </div>
  </div>

<script>
(function(){
  const C = CONFIG;
  const $ = id => document.getElementById(id);
  const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ---------- fill static text ---------- */
  $('forName').textContent = C.forName;
  $('heroSub').textContent = C.heroSubtitle;

  /* ---------- reveal-on-scroll ---------- */
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }});
  }, {threshold:0.15});
  function watch(){ document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el)); }

  /* ---------- gate helper (输入日期/名称才能进入下一步) ---------- */
  function norm(s){ return String(s).toLowerCase().trim().replace(/[\s./_,-]/g,''); }
  /* 把任何常见写法的日期归一成 YYYYMMDD，这样 2024-03-15 / 2024/3/15 / 3/15/2024 都能对上 */
  function dateKey(s){
    const nums = String(s).match(/\d+/g);
    if(!nums || nums.length < 3) return null;
    let y,m,d;
    if(nums[0].length===4){ y=nums[0]; m=nums[1]; d=nums[2]; }        // 年在前: YYYY M D
    else if(nums[2].length===4){ y=nums[2]; m=nums[0]; d=nums[1]; }   // 年在后: M D YYYY
    else return null;
    m=String(+m).padStart(2,'0'); d=String(+d).padStart(2,'0');
    if(+m>12 && +d<=12){ const t=m; m=d; d=t; }                       // 顺序反了就换回来
    return y+m+d;
  }
  function makeGate(cfg, ids, onPass, intercept){
    $(ids.title).textContent = cfg.title;
    $(ids.prompt).textContent = cfg.prompt;
    $(ids.input).placeholder = cfg.placeholder || '';
    const accepted = cfg.answers.map(norm);
    const acceptedDates = cfg.answers.map(dateKey).filter(Boolean);
    $(ids.form).addEventListener('submit', ev=>{
      ev.preventDefault();
      const raw = $(ids.input).value;
      if(intercept && intercept(raw)){ $(ids.input).value=''; return; }   // 彩蛋优先拦截
      const ok = (norm(raw) && accepted.includes(norm(raw)))
              || (dateKey(raw) && acceptedDates.includes(dateKey(raw)));
      if(ok){
        onPass();
      } else {
        const g = $(ids.gate);
        g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
        $(ids.hint).textContent = cfg.hint || 'Not quite. Try again.';
      }
    });
  }

  /* ---------- Gate 1: entry ---------- */
  makeGate(C.gateEntry,
    {title:'ge-title', prompt:'ge-prompt', input:'ge-input', form:'ge-form', hint:'ge-hint', gate:'gateEntry'},
    ()=>{
      $('afterEntry').classList.remove('locked');
      try { buildAfterEntry(); } catch(err){ console.error('build error:', err); }
      watch();
      const y = $('timeline').getBoundingClientRect().top + window.scrollY - 10;
      window.scrollTo({top:y, behavior: reduce ? 'auto' : 'smooth'});
    },
    (raw)=>{                                        // 彩蛋：打 iloveyou → 大大的一句话
      const t = (C.eggs && C.eggs.loveYouTrigger) ? norm(C.eggs.loveYouTrigger) : 'iloveyou';
      if(t && norm(raw) === t){
        showOverlay((C.eggs && C.eggs.loveYouMessage) || 'I love you too', true);
        return true;
      }
      return false;
    });

  /* ---------- Gate 2: letter —— 多步问答（全部答对才解锁） ---------- */
  function makeSteppedGate(cfg, ids, onComplete){
    const steps = cfg.steps || [];
    let step = 0;
    $(ids.title).textContent = cfg.title;
    function render(){
      const s = steps[step];
      $(ids.prompt).textContent = s.prompt;
      $(ids.input).placeholder = s.placeholder || '';
      $(ids.input).value = '';
      $(ids.hint).textContent = '';
      if($(ids.step)) $(ids.step).textContent = (step+1) + ' / ' + steps.length;
      if($(ids.btn))  $(ids.btn).textContent = (step === steps.length-1) ? 'Unlock' : 'Next';
    }
    render();
    $(ids.form).addEventListener('submit', ev=>{
      ev.preventDefault();
      const s = steps[step];
      const accepted = s.answers.map(norm);
      if(norm($(ids.input).value) && accepted.includes(norm($(ids.input).value))){
        step++;
        if(step >= steps.length){ onComplete(); }
        else { render(); }
      } else {
        const g = $(ids.gate);
        g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
        $(ids.hint).textContent = s.hint || 'Not quite. Try again.';
      }
    });
  }
  function initLetterGate(){
    makeSteppedGate(C.gateLetter,
      {title:'gl-title', prompt:'gl-prompt', input:'gl-input', form:'gl-form', hint:'gl-hint', gate:'gateLetter', step:'gl-step', btn:'gl-btn'},
      ()=>{
        $('gateLetter').style.display='none';
        $('letterWrap').classList.remove('locked');
        watch();
      });
  }

  /* ---------- build content revealed after entry ---------- */
  let built = false;
  function buildAfterEntry(){
    if(built) return; built = true;

    /* timeline */
    $('tl').innerHTML = C.timeline.map(t=>
      `<div class="tl-item"><div class="tl-date">${t.date}</div><h3>${t.title}</h3><p>${t.text}</p></div>`
    ).join('');

    /* clocks + distance */
    $('youCity').textContent = C.you.city;
    $('himCity').textContent = C.him.city;
    $('distSay').textContent = C.distanceLine;
    startClocks();
    showDistance();

    /* egg: tap the distance number -> 0 km */
    if(C.eggs && C.eggs.distanceZero){
      const kmEl = $('km'), sayEl = $('distSay');
      let saved = null, eggTimer = null;
      kmEl.addEventListener('click', ()=>{
        if(saved === null) saved = kmEl.innerHTML;
        kmEl.innerHTML = '0 km <small>&middot; right here</small>';
        sayEl.textContent = C.eggs.distanceZero;
        clearTimeout(eggTimer);
        eggTimer = setTimeout(()=>{ kmEl.innerHTML = saved; sayEl.textContent = C.distanceLine; }, 3500);
      });
    }

    /* reasons jar */
    let last = -1, opens = 0, bonusShown = false;
    $('drawNote').addEventListener('click', ()=>{
      opens++;
      const el = $('note'); el.classList.add('fade');
      setTimeout(()=>{
        let txt;
        if(C.eggs && C.eggs.jarBonus && !bonusShown && opens > C.notes.length){
          bonusShown = true; txt = C.eggs.jarBonus;
        } else {
          let i; do { i = Math.floor(Math.random()*C.notes.length); } while(C.notes.length>1 && i===last);
          last = i; txt = C.notes[i];
        }
        el.textContent = txt; el.classList.remove('fade');
      }, reduce ? 0 : 380);
    });

    /* countdown */
    $('cdHead').textContent = C.meetup.label.charAt(0).toUpperCase()+C.meetup.label.slice(1);
    startCountdown();

    /* letter —— 把触发词组包成可点击（点它弹蛋糕问题） */
    $('lt-head').textContent = C.letter.heading;
    const trigger = (C.eggs && C.eggs.letterTrigger) ? C.eggs.letterTrigger : '';
    let wrapped = false;
    $('lt-body').innerHTML = C.letter.body.map(p=>{
      if(!wrapped && trigger){
        const idx = p.toLowerCase().indexOf(trigger.toLowerCase());
        if(idx >= 0){
          wrapped = true;
          return '<p>'+p.slice(0,idx)+'<span class="love-trigger" id="loveTrigger">'
                 +p.slice(idx, idx+trigger.length)+'</span>'+p.slice(idx+trigger.length)+'</p>';
        }
      }
      return '<p>'+p+'</p>';
    }).join('');
    $('lt-signoff').textContent = C.letter.signoff + ' ';
    $('lt-signname').textContent = C.letter.signName;
    if(wrapped) $('loveTrigger').addEventListener('click', openCake);
    buildChat();
    initLetterGate();

    /* PS */
    $('psText').textContent = C.ps;
    const psObs = new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); psObs.unobserve(e.target); }});
    }, {threshold:0.4});
    psObs.observe($('psText'));
  }

  /* ---------- live clocks ---------- */
  function fmt(tz){
    try { return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:true})
      .format(new Date()).toLowerCase(); }
    catch(e){ return '--:--'; }
  }
  function dayLabel(tz){
    try { return new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'long',month:'short',day:'numeric'}).format(new Date()); }
    catch(e){ return 'Check the timezone spelling'; }
  }
  function hourIn(tz){
    try { return +new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',hour12:false}).format(new Date()); }
    catch(e){ return 12; }
  }
  function greetFor(h){
    if(h<5)  return "You're probably asleep. Sleep well.";
    if(h<12) return "Good morning over there.";
    if(h<17) return "Good afternoon over there.";
    if(h<22) return "Good evening over there.";
    return "It's late for you. Rest soon.";
  }
  function tickClocks(){
    $('youTime').textContent = fmt(C.you.timezone);
    $('youMeta').textContent = dayLabel(C.you.timezone);
    $('himTime').textContent = fmt(C.him.timezone);
    $('himMeta').textContent = dayLabel(C.him.timezone);
    $('himGreet').textContent = greetFor(hourIn(C.him.timezone));
  }
  function startClocks(){ tickClocks(); setInterval(tickClocks,1000); }

  /* ---------- distance (haversine) ---------- */
  function showDistance(){
    const R=6371, toRad=d=>d*Math.PI/180;
    const dLat=toRad(C.him.lat-C.you.lat), dLng=toRad(C.him.lng-C.you.lng);
    const a=Math.sin(dLat/2)**2 + Math.cos(toRad(C.you.lat))*Math.cos(toRad(C.him.lat))*Math.sin(dLng/2)**2;
    const km=Math.round(2*R*Math.asin(Math.sqrt(a)));
    const mi=Math.round(km*0.621371);
    $('km').innerHTML = km.toLocaleString()+' km <small>&middot; '+mi.toLocaleString()+' mi apart</small>';
  }

  /* ---------- countdown ---------- */
  function startCountdown(){
    const target = new Date(C.meetup.target).getTime();
    function tick(){
      const diff = target - Date.now();
      if(diff<=0){
        $('cd').style.display='none';
        $('cdSay').textContent = C.meetup.over;
        return;
      }
      const d=Math.floor(diff/86400000);
      const h=Math.floor(diff%86400000/3600000);
      const m=Math.floor(diff%3600000/60000);
      const s=Math.floor(diff%60000/1000);
      $('cd-d').textContent=d; $('cd-h').textContent=h;
      $('cd-m').textContent=String(m).padStart(2,'0');
      $('cd-s').textContent=String(s).padStart(2,'0');
    }
    tick(); setInterval(tick,1000);
  }

  /* ---------- heart easter egg (点 5 下爱心) ---------- */
  let clicks=0, timer=null;
  $('heart').addEventListener('click', ()=>{
    clicks++;
    clearTimeout(timer);
    timer=setTimeout(()=>clicks=0, 1500);
    if(clicks>=5){ clicks=0; rainHearts(); }
  });
  function rainHearts(){
    if(reduce) return;
    const colors=['#C9ADA7','#A3B18A','#B08968','#9DA9B0'];
    for(let i=0;i<16;i++){
      const s=document.createElement('div');
      s.className='floater'; s.textContent='\u2665';
      s.style.left=Math.random()*100+'vw';
      s.style.color=colors[i%4];
      s.style.animationDelay=(Math.random()*0.8)+'s';
      s.style.fontSize=(16+Math.random()*18)+'px';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),4200);
    }
  }

  /* ---------- egg: double-tap / double-click blooms a heart ---------- */
  function bloomHeart(x,y){
    if(reduce) return;
    const h=document.createElement('div');
    h.className='bloom'; h.textContent='\u2665';
    h.style.left=x+'px'; h.style.top=y+'px';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1200);
  }
  document.addEventListener('dblclick', e=>bloomHeart(e.clientX,e.clientY));
  let lastTap=0;
  document.addEventListener('touchend', e=>{
    const now=Date.now(), t=e.changedTouches[0];
    if(now-lastTap<350 && t) bloomHeart(t.clientX,t.clientY);
    lastTap=now;
  }, {passive:true});

  /* ---------- shared overlay for secret / love messages ---------- */
  function showOverlay(text, big){
    const card = $('secretOverlay').querySelector('.secret-card');
    $('secretMsg').textContent = text;
    card.classList.toggle('big', !!big);
    $('secretOverlay').classList.add('show');
    rainHearts();
  }
  function closeSecret(){ $('secretOverlay').classList.remove('show'); }
  $('secretClose').addEventListener('click', closeSecret);
  $('secretOverlay').addEventListener('click', e=>{ if(e.target===$('secretOverlay')) closeSecret(); });

  /* ---------- egg: type the secret word anywhere ---------- */
  const eggs = C.eggs || {};
  const secretWord = (eggs.secretWord||'').toLowerCase();
  let typed='';
  document.addEventListener('keydown', e=>{
    if(e.key.length!==1) return;                                   // only single characters
    if(document.activeElement && document.activeElement.tagName==='INPUT') return; // don't hijack the gates
    typed=(typed+e.key.toLowerCase()).slice(-40);
    if(secretWord && typed.endsWith(secretWord)){
      typed=''; showOverlay(eggs.secretMessage || 'I love you.', false);
    }
  });

  /* ---------- egg: the "little brown cake" yes/no question ---------- */
  let yesScale = 1;
  function openCake(){
    $('cakeQ').textContent   = eggs.cakeQuestion || 'Will you?';
    $('cakeYes').textContent = eggs.cakeYes || 'Yes';
    $('cakeNo').textContent  = eggs.cakeNo || 'No';
    $('cakeBtns').style.display = '';
    $('cakeClose').style.display = 'none';
    yesScale = 1;
    $('cakeYes').style.transform = 'scale(1)';
    $('cakeNo').style.transform  = 'scale(1)';
    $('cakeOverlay').classList.add('show');
  }
  $('cakeNo').addEventListener('click', ()=>{
    yesScale = Math.min(yesScale + 0.35, 4);                        // 每点一次 No，Yes 变大
    $('cakeYes').style.transform = 'scale('+yesScale+')';
    $('cakeNo').style.transform  = 'scale('+Math.max(0.55, 1-(yesScale-1)*0.15)+')';
  });
  $('cakeYes').addEventListener('click', ()=>{
    $('cakeQ').textContent = eggs.cakeThanks || 'Thank you.';       // 点 Yes → 谢谢你
    $('cakeBtns').style.display = 'none';
    $('cakeClose').style.display = '';
    rainHearts();
  });
  $('cakeClose').addEventListener('click', ()=>$('cakeOverlay').classList.remove('show'));
  $('cakeOverlay').addEventListener('click', e=>{ if(e.target===$('cakeOverlay')) $('cakeOverlay').classList.remove('show'); });

  /* ---------- the little chat box after the letter ---------- */
  function buildChat(){
    const cfg = C.chat; if(!cfg) return;
    $('chatIntro').textContent = cfg.intro || '';
    $('chatInput').placeholder = cfg.placeholder || '';
    function add(text, who){
      const b = document.createElement('div');
      b.className = 'bubble '+who; b.textContent = text;
      $('chatLog').appendChild(b);
      $('chatLog').scrollTop = $('chatLog').scrollHeight;
    }
    $('chatForm').addEventListener('submit', ev=>{
      ev.preventDefault();
      const raw = $('chatInput').value.trim();
      if(!raw) return;
      add(raw, 'you');
      $('chatInput').value = '';
      const key = norm(raw);
      let reply = cfg.fallback || '...';
      for(const p of (cfg.pairs||[])){
        const q = norm(p.q);
        if(q && (key === q || key.includes(q))){ reply = p.a; break; }
      }
      setTimeout(()=>add(reply, 'me'), reduce ? 0 : 450);
    });
  }

  /* initial watch for hero + gate1 */
  watch();
})();
</script>
</body>
</html>
