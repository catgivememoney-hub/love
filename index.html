<title>For You</title>

<!--
============================================================
  给你的填写说明（只改下面这一个 CONFIG 就够了，别的都不用动）
  All content is English. Fill in every [ ... ] below.
  时区用这种写法: "America/Los_Angeles"、"Asia/Shanghai" 等
  日期门的答案支持 2024-03-15 / 2024/03/15 / 20240315 都能对上
============================================================
-->
<script>
const CONFIG = {

  /* ---------- 开场 Hero ---------- */
  forName: "jeffy",
  heroSubtitle: "A little corner of the internet, made only for you.",

  /* ---------- 门 1：进门 —— 输入"我们在一起的那一天" 2026-01-18 ---------- */
  gateEntry: {
    title: "Only you can open this",
    prompt: "Type the day we became us, as YYYY-MM-DD.",
    answers: ["2026-01-18"],
    placeholder: "YYYY-MM-DD",
    hint: "The day everything changed."
  },

  /* ---------- 时间线（按时间顺序，日期都已填好） ---------- */
  timeline: [
    { date: "September 13, 2025", title: "The day we first knew each other", text: "319 days before I made this" },
    { date: "December 18, 2025",  title: "We added each other on Discord",   text: "One little friend request that changed everything." },
    { date: "January 18, 2026",   title: "The day we became us",             text: "11:30 — the moment 'maybe' turned into 'yes'." },
    { date: "January 19, 2026",   title: "The first time I said I like you", text: "I like you, I love you!!!!!!!!" },
    { date: "February 12, 2026",  title: "The first time I said I love you", text: "Three words I'd never meant more." },
    { date: "February 16, 2026",  title: "Our first video call",            text: "Seeing you in real time — worth every second of the wait." },
    { date: "February 23, 2026",  title: "Closeness level 10, unlocked",     text: "As close as it would let us get. We wanted closer." },
    { date: "July 11, 2026",      title: "The first time we met in person",  text: "Finally, no screen between us." },
    { date: "July 13, 2026",      title: "Our first SAT session together",   text: "What did we do? Definitely SAT:)" }
  ],

  /* ---------- 两地时间 + 距离（洛杉矶 & 圣何塞，同一时区，距离约 490km） ---------- */
  you: { city: "Los Angeles", timezone: "America/Los_Angeles", lat: 34.0522, lng: -118.2437 },
  him: { city: "San Jose",    timezone: "America/Los_Angeles", lat: 37.3382, lng: -121.8863 },
  distanceLine: "That's the distance on a map. On the inside, you're always right here.",

  /* ---------- 情话罐子（点一下随机抽一条） ---------- */
  notes: [
    "Because you're the first person I've ever fit with this perfectly.",
    "Because I could never get tired of you — not ever.",
    "Because being with you is the most relaxed I ever feel.",
    "Because you're my first love and my last.",
    "Because you believe in me, and I believe in you.",
    "Because you're the one I was meant to find."
  ],

  /* ---------- 倒计时：倒数到 9 月 30 号 ---------- */
  meetup: {
    target: "2026-09-30T00:00:00",
    label: "until I see you again",
    over:  "The wait is over. Come here."
  },

  /* ---------- 门 2：信 —— 暗号 fruit cup ---------- */
  gateLetter: {
    title: "One last door",
    prompt: "Type our very first secret code to open this.",
    answers: ["fruit cup"],                     // 输 "fruit cup" 或 "fruitcup" 都能过
    placeholder: "Our first secret code",
    hint: "Remember the first one we ever set?"
  },
  letter: {
    heading: "A letter for you",
    /* 👇 信在这里写，一行一段，想写多少段就加多少行。全英文。 */
    body: [
      "[生日快乐呀，我最爱的小宝贝。我知道语言根本无法诠释我对你的爱，可是心里攒了太多想对你说的话希望你能耐心看完。还记得我们初次认识的那段时间吗？我已经不记得我们为什么会玩在一起了，也忘记了是哪场对局认识的你。但是我记得你给我留下了一个很好的第一印象-你，耐心，不压力队友，礼貌而且声音很好听。后面退游了一段时间之后我们又开始一起玩了。我不知道为什么会有那么多的巧合，但是种种缘分让我们不停的相遇。还记得我们绑定的闺蜜标吗-我想起来了，其实是我主动绑的。不知道是出于什么心思，是遇到了一个想要一起玩的朋友还是不知从什么时候产生的好感？我也说不清楚。第一次真正意识到我喜欢上你--第一次正视我内心的想法，是在和你在一起的几个星期之前。我有想过要不要和你表白，要不要直接当做什么都没想，或者是尝试让你喜欢我。但是最终我选择什么都不做，我选择一如既往的和你玩。我能感觉到你好像也喜欢我，所以我时不时问你或者开几句玩笑。让我没想到的是1月18号的那天晚上，嘴硬的你竟然承认了！于是我们顺理成章的变成了情侣。我无法诉说我当时的心情：是害怕吗？害怕这是一个错误的决定，害怕网恋被发现，害怕我们无法克服距离的隔阂。是开心吗？证实我喜欢的人也喜欢我的那一刻的激动和欣喜若狂。是期待吗？期待我和你的未来，期待我们给对方的惊喜。还是对未知的担忧呢？担忧你不喜欢我不愿意接纳或者了解真正的我。但是随着时间的推移，我也慢慢找到了答案。我们的契合程度竟然是我从未想象过的，我们有各自的思想，但是我们的各种方面却也出奇的相似。不论是相似的爱好，相似的性格，相似的习惯，还是相似的经历，相似的世界观，或是相似的种种，我们都是无比契合并且愿意接纳对方的不同，享受对方和自己的共同之处的两个人。]",
      "我爱你，特别特别爱你，无法诉说的爱，比昨天多一点，比明天少一点。无论你询问多少遍，我的答案都会是一样的。比昨天多的一点是因为时间带来的羁绊，比明天少一点是因为给未来的自己留有空间。但是不论明天还是今天甚至是明年，我对你的爱都会一直存在。记得我们不敢对对方表现出过度依赖的那几次吗？相信现在的你也慢慢理解了吧，我很依赖你，很黏你，想要时时刻刻和你在一起！不用担心你会让我厌烦，因为我和别人不一样，我是我自己。感谢你出现在我的世界里，让我曾经无感的那一部分忽然出现了温度。刚在一起的那几个月你告诉我想到我会心口暖暖的，对我来说很难理解。可是现在我似乎明白了，因为我每次想到你的那种感觉从一个模糊抽象的概念慢慢的变成了一个又一个清晰的感触。每个想到你的瞬间都让我的心止不住得悸动，让我的脸颊发烫，让你的形象不停地侵蚀我的大脑知道我思来想去都只能想到你。我不知道我们的以后会怎么样，但是我能确定我很爱很爱你 害怕失去 不想放弃你 更不想错过你。 我爱你，我希望接下来我们可以一起努力，或是偶尔偷懒，但是永远一起炒我们的目标前进。"
    ],
    signoff: "永远永远爱你,",
    signName: "presley"
  },

  /* ---------- 最底部藏的一句 P.S.（想改就改，不改也行） ---------- */
  ps: "Wherever you are, look up. Same sky, always."
};
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --cream:#EDE4D8; --paper:#F4EEE4; --latte:#D8C3A5; --caramel:#B08968;
    --coffee:#7F5539; --espresso:#4A3728; --muted:#6E5A48;
    --sage:#A3B18A; --rose:#C9ADA7; --slate:#9DA9B0;
    --line:#DBCDBB;
    --display:'Instrument Sans',system-ui,sans-serif;
    --body:'Instrument Sans',system-ui,sans-serif;
    --mono:'DM Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--cream); color:var(--espresso);
    font-family:var(--body); font-size:17px; line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--display); font-weight:500; letter-spacing:-.02em; color:var(--coffee); line-height:1.15; margin:0}
  a{color:inherit}
  ::selection{background:var(--rose); color:var(--espresso)}

  .wrap{max-width:760px; margin:0 auto; padding:0 24px}
  section{padding:88px 0}
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--caramel); margin:0 0 14px;
  }

  /* ---- reveal on scroll ---- */
  .reveal{opacity:0; transform:translateY(18px); transition:opacity .9s ease, transform .9s ease}
  .reveal.in{opacity:1; transform:none}

  /* ---- HERO ---- */
  .hero{min-height:100vh; display:flex; flex-direction:column; align-items:center;
        justify-content:center; text-align:center; padding:40px 24px}
  .heart{width:56px; height:56px; cursor:pointer; margin-bottom:26px;
         animation:beat 1.9s ease-in-out infinite; transform-origin:center}
  .heart path{fill:var(--rose)}
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.14)}28%{transform:scale(1)}42%{transform:scale(1.09)}}
  .hero h1{font-size:clamp(44px,9vw,84px)}
  .hero h1 em{font-style:italic; color:var(--caramel)}
  .hero .sub{color:var(--muted); max-width:38ch; margin:20px auto 0}
  .scrolldown{margin-top:54px; font-family:var(--mono); font-size:12px;
              letter-spacing:.2em; text-transform:uppercase; color:var(--caramel)}
  .scrolldown span{display:block; margin-top:8px; animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  /* ---- GATE (locked door) ---- */
  .gate{max-width:520px; margin:0 auto; text-align:center;
        background:var(--paper); border:1px solid var(--line);
        border-radius:18px; padding:44px 32px}
  .gate .lockicon{font-size:26px; color:var(--caramel)}
  .gate h2{font-size:30px; margin:14px 0 10px}
  .gate p.q{color:var(--muted); margin:0 0 22px}
  .gate form{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .gate input{
    flex:1 1 220px; min-width:0; font-family:var(--mono); font-size:15px;
    padding:13px 16px; border:1px solid var(--line); border-radius:12px;
    background:#fff; color:var(--espresso); outline:none; text-align:center;
  }
  .gate input:focus{border-color:var(--caramel); box-shadow:0 0 0 3px rgba(176,137,104,.18)}
  .btn{
    font-family:var(--body); font-weight:600; font-size:15px; cursor:pointer;
    padding:13px 24px; border:none; border-radius:12px;
    background:var(--coffee); color:var(--paper); transition:background .25s ease;
  }
  .btn:hover{background:var(--espresso)}
  .btn:focus-visible{outline:3px solid var(--caramel); outline-offset:2px}
  .gate .hint{margin:16px 0 0; font-size:13px; color:var(--caramel); min-height:18px}
  .shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

  .locked{display:none}          /* content hidden until its gate is passed */

  /* ---- TIMELINE ---- */
  .tl{position:relative; margin-top:12px; padding-left:26px}
  .tl::before{content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line)}
  .tl-item{position:relative; padding:0 0 40px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:""; position:absolute; left:-26px; top:7px; width:12px; height:12px;
                   border-radius:50%; background:var(--sage); border:2px solid var(--cream)}
  .tl-date{font-family:var(--mono); font-size:12px; letter-spacing:.12em; color:var(--caramel); text-transform:uppercase}
  .tl-item h3{font-size:22px; margin:5px 0 6px}
  .tl-item p{margin:0; color:var(--muted)}

  /* ---- DISTANCE & TIME ---- */
  .clocks{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:8px}
  .clock{background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:26px 22px; text-align:center}
  .clock .city{font-family:var(--display); font-size:21px; color:var(--coffee)}
  .clock .time{font-family:var(--mono); font-size:34px; color:var(--espresso); margin:8px 0 4px; letter-spacing:.02em}
  .clock .meta{font-size:13px; color:var(--muted)}
  .clock .greet{margin-top:10px; font-size:13px; color:var(--caramel); font-style:italic; font-family:var(--display)}
  .distance{text-align:center; margin-top:30px}
  .distance .km{font-family:var(--mono); font-size:clamp(30px,7vw,48px); color:var(--coffee)}
  .distance .km small{font-size:15px; color:var(--muted); letter-spacing:.04em}
  .distance .say{max-width:34ch; margin:16px auto 0; color:var(--muted); font-family:var(--display); font-style:italic; font-size:19px}

  /* ---- REASONS JAR ---- */
  .jar{background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:40px 30px; text-align:center; margin-top:8px}
  .jar .note{font-family:var(--display); font-style:italic; font-size:24px; color:var(--espresso);
             min-height:96px; display:flex; align-items:center; justify-content:center;
             transition:opacity .4s ease; padding:0 6px}
  .jar .note.fade{opacity:0}

  /* ---- COUNTDOWN ---- */
  .cd{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:8px; text-align:center}
  .cd .unit{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:22px 6px}
  .cd .num{font-family:var(--mono); font-size:clamp(26px,7vw,40px); color:var(--coffee)}
  .cd .lbl{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--caramel); margin-top:6px}
  .cd-say{text-align:center; margin-top:22px; color:var(--muted); font-family:var(--display); font-style:italic; font-size:19px}

  /* ---- LETTER ---- */
  .letter{background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:44px 38px}
  .letter h2{font-size:32px; margin-bottom:20px}
  .letter p{color:var(--espresso); margin:0 0 18px}
  .letter .sign{font-family:var(--display); font-style:italic; font-size:22px; color:var(--coffee); margin-top:26px}
  .letter .sign b{display:block; font-style:normal; font-weight:500}

  /* ---- FOOTER / PS ---- */
  footer{padding:70px 24px 90px; text-align:center}
  footer .ps{font-family:var(--mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--caramel)}
  footer .ps-text{font-family:var(--display); font-style:italic; font-size:22px; color:var(--coffee);
                  margin-top:14px; opacity:0; transform:translateY(10px); transition:opacity 1.1s ease, transform 1.1s ease}
  footer .ps-text.in{opacity:1; transform:none}

  /* ---- floating hearts easter egg ---- */
  .floater{position:fixed; bottom:-20px; font-size:22px; pointer-events:none; z-index:50;
           animation:float-up 3.4s ease-in forwards}
  @keyframes float-up{to{transform:translateY(-115vh) rotate(24deg); opacity:0}}

  @media (max-width:560px){
    section{padding:64px 0}
    .clocks{grid-template-columns:1fr}
    .cd{grid-template-columns:repeat(2,1fr)}
    .letter{padding:34px 24px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important}
    .reveal{opacity:1; transform:none; transition:none}
    .ps-text{opacity:1; transform:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

  <!-- ===================== HERO ===================== -->
  <header class="hero">
    <svg class="heart" id="heart" viewBox="0 0 24 24" aria-label="A heart">
      <path d="M12 21s-7.5-4.9-10-9.2C.2 8.6 1.7 5 5.2 5c2 0 3.3 1.1 4 2.2C10 6.1 11.3 5 13.3 5 16.8 5 18.3 8.6 16.5 11.8 14 16.1 12 21 12 21z"/>
    </svg>
    <h1>For <em id="forName">you</em></h1>
    <p class="sub" id="heroSub"></p>
    <div class="scrolldown">scroll<span>&#8595;</span></div>
  </header>

  <!-- ===================== GATE 1: ENTRY ===================== -->
  <section id="entry">
    <div class="wrap">
      <div class="gate reveal" id="gateEntry">
        <div class="lockicon">&#9906;</div>
        <h2 id="ge-title"></h2>
        <p class="q" id="ge-prompt"></p>
        <form id="ge-form" autocomplete="off">
          <input id="ge-input" type="text" aria-label="Answer" />
          <button class="btn" type="submit">Open</button>
        </form>
        <p class="hint" id="ge-hint"></p>
      </div>
    </div>
  </section>

  <!-- Everything below stays hidden until Gate 1 is passed -->
  <div class="locked" id="afterEntry">

    <!-- ===================== TIMELINE ===================== -->
    <section id="timeline">
      <div class="wrap">
        <p class="eyebrow reveal">Our story, in order</p>
        <h2 class="reveal" style="font-size:34px; margin-bottom:8px">How we got here</h2>
        <div class="tl reveal" id="tl"></div>
      </div>
    </section>

    <!-- ===================== DISTANCE & TIME ===================== -->
    <section id="distance">
      <div class="wrap">
        <p class="eyebrow reveal">Same clock, still too far</p>
        <h2 class="reveal" style="font-size:34px; margin-bottom:18px">Where we are right now</h2>
        <div class="clocks reveal">
          <div class="clock">
            <div class="city" id="youCity"></div>
            <div class="time" id="youTime">--:--</div>
            <div class="meta" id="youMeta"></div>
          </div>
          <div class="clock">
            <div class="city" id="himCity"></div>
            <div class="time" id="himTime">--:--</div>
            <div class="meta" id="himMeta"></div>
            <div class="greet" id="himGreet"></div>
          </div>
        </div>
        <div class="distance reveal">
          <div class="km" id="km">&mdash;</div>
          <p class="say" id="distSay"></p>
        </div>
      </div>
    </section>

    <!-- ===================== REASONS JAR ===================== -->
    <section id="reasons">
      <div class="wrap">
        <p class="eyebrow reveal">Open one anytime</p>
        <h2 class="reveal" style="font-size:34px; margin-bottom:18px">Reasons, on a loop</h2>
        <div class="jar reveal">
          <div class="note" id="note">Tap the button and I'll tell you one.</div>
          <button class="btn" id="drawNote" type="button" style="margin-top:22px">Open a note</button>
        </div>
      </div>
    </section>

    <!-- ===================== COUNTDOWN ===================== -->
    <section id="countdown">
      <div class="wrap">
        <p class="eyebrow reveal">Counting down</p>
        <h2 class="reveal" style="font-size:34px; margin-bottom:18px" id="cdHead"></h2>
        <div class="cd reveal" id="cd">
          <div class="unit"><div class="num" id="cd-d">0</div><div class="lbl">days</div></div>
          <div class="unit"><div class="num" id="cd-h">0</div><div class="lbl">hours</div></div>
          <div class="unit"><div class="num" id="cd-m">0</div><div class="lbl">mins</div></div>
          <div class="unit"><div class="num" id="cd-s">0</div><div class="lbl">secs</div></div>
        </div>
        <p class="cd-say reveal" id="cdSay"></p>
      </div>
    </section>

    <!-- ===================== GATE 2: LETTER ===================== -->
    <section id="letterGate">
      <div class="wrap">
        <div class="gate reveal" id="gateLetter">
          <div class="lockicon">&#9906;</div>
          <h2 id="gl-title"></h2>
          <p class="q" id="gl-prompt"></p>
          <form id="gl-form" autocomplete="off">
            <input id="gl-input" type="text" aria-label="Answer" />
            <button class="btn" type="submit">Unlock</button>
          </form>
          <p class="hint" id="gl-hint"></p>
        </div>

        <div class="locked" id="letterWrap" style="margin-top:8px">
          <div class="letter reveal">
            <h2 id="lt-head"></h2>
            <div id="lt-body"></div>
            <div class="sign"><span id="lt-signoff"></span><b id="lt-signname"></b></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== FOOTER / PS ===================== -->
    <footer>
      <div class="ps">P.S.</div>
      <div class="ps-text" id="psText"></div>
    </footer>

  </div><!-- /afterEntry -->

<script>
(function(){
  const C = CONFIG;
  const $ = id => document.getElementById(id);
  const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ---------- fill static text ---------- */
  $('forName').textContent = C.forName;
  $('heroSub').textContent = C.heroSubtitle;

  /* ---------- reveal-on-scroll ---------- */
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }});
  }, {threshold:0.15});
  function watch(){ document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el)); }

  /* ---------- gate helper (输入日期/名称才能进入下一步) ---------- */
  function norm(s){ return String(s).toLowerCase().trim().replace(/[\s./_,-]/g,''); }
  /* 把任何常见写法的日期归一成 YYYYMMDD，这样 2024-03-15 / 2024/3/15 / 3/15/2024 都能对上 */
  function dateKey(s){
    const nums = String(s).match(/\d+/g);
    if(!nums || nums.length < 3) return null;
    let y,m,d;
    if(nums[0].length===4){ y=nums[0]; m=nums[1]; d=nums[2]; }        // 年在前: YYYY M D
    else if(nums[2].length===4){ y=nums[2]; m=nums[0]; d=nums[1]; }   // 年在后: M D YYYY
    else return null;
    m=String(+m).padStart(2,'0'); d=String(+d).padStart(2,'0');
    if(+m>12 && +d<=12){ const t=m; m=d; d=t; }                       // 顺序反了就换回来
    return y+m+d;
  }
  function makeGate(cfg, ids, onPass){
    $(ids.title).textContent = cfg.title;
    $(ids.prompt).textContent = cfg.prompt;
    $(ids.input).placeholder = cfg.placeholder || '';
    const accepted = cfg.answers.map(norm);
    const acceptedDates = cfg.answers.map(dateKey).filter(Boolean);
    $(ids.form).addEventListener('submit', ev=>{
      ev.preventDefault();
      const raw = $(ids.input).value;
      const ok = (norm(raw) && accepted.includes(norm(raw)))
              || (dateKey(raw) && acceptedDates.includes(dateKey(raw)));
      if(ok){
        onPass();
      } else {
        const g = $(ids.gate);
        g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
        $(ids.hint).textContent = cfg.hint || 'Not quite. Try again.';
      }
    });
  }

  /* ---------- Gate 1: entry ---------- */
  makeGate(C.gateEntry,
    {title:'ge-title', prompt:'ge-prompt', input:'ge-input', form:'ge-form', hint:'ge-hint', gate:'gateEntry'},
    ()=>{
      $('afterEntry').classList.remove('locked');
      try { buildAfterEntry(); } catch(err){ console.error('build error:', err); }
      watch();
      const y = $('timeline').getBoundingClientRect().top + window.scrollY - 10;
      window.scrollTo({top:y, behavior: reduce ? 'auto' : 'smooth'});
    });

  /* ---------- Gate 2: letter ---------- */
  function initLetterGate(){
    makeGate(C.gateLetter,
      {title:'gl-title', prompt:'gl-prompt', input:'gl-input', form:'gl-form', hint:'gl-hint', gate:'gateLetter'},
      ()=>{
        $('gateLetter').style.display='none';
        $('letterWrap').classList.remove('locked');
        watch();
      });
  }

  /* ---------- build content revealed after entry ---------- */
  let built = false;
  function buildAfterEntry(){
    if(built) return; built = true;

    /* timeline */
    $('tl').innerHTML = C.timeline.map(t=>
      `<div class="tl-item"><div class="tl-date">${t.date}</div><h3>${t.title}</h3><p>${t.text}</p></div>`
    ).join('');

    /* clocks + distance */
    $('youCity').textContent = C.you.city;
    $('himCity').textContent = C.him.city;
    $('distSay').textContent = C.distanceLine;
    startClocks();
    showDistance();

    /* reasons jar */
    let last = -1;
    $('drawNote').addEventListener('click', ()=>{
      const el = $('note'); el.classList.add('fade');
      setTimeout(()=>{
        let i; do { i = Math.floor(Math.random()*C.notes.length); } while(C.notes.length>1 && i===last);
        last = i; el.textContent = C.notes[i]; el.classList.remove('fade');
      }, reduce ? 0 : 380);
    });

    /* countdown */
    $('cdHead').textContent = C.meetup.label.charAt(0).toUpperCase()+C.meetup.label.slice(1);
    startCountdown();

    /* letter */
    $('lt-head').textContent = C.letter.heading;
    $('lt-body').innerHTML = C.letter.body.map(p=>`<p>${p}</p>`).join('');
    $('lt-signoff').textContent = C.letter.signoff + ' ';
    $('lt-signname').textContent = C.letter.signName;
    initLetterGate();

    /* PS */
    $('psText').textContent = C.ps;
    const psObs = new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); psObs.unobserve(e.target); }});
    }, {threshold:0.4});
    psObs.observe($('psText'));
  }

  /* ---------- live clocks ---------- */
  function fmt(tz){
    try { return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:true})
      .format(new Date()).toLowerCase(); }
    catch(e){ return '--:--'; }
  }
  function dayLabel(tz){
    try { return new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'long',month:'short',day:'numeric'}).format(new Date()); }
    catch(e){ return 'Check the timezone spelling'; }
  }
  function hourIn(tz){
    try { return +new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',hour12:false}).format(new Date()); }
    catch(e){ return 12; }
  }
  function greetFor(h){
    if(h<5)  return "You're probably asleep. Sleep well.";
    if(h<12) return "Good morning over there.";
    if(h<17) return "Good afternoon over there.";
    if(h<22) return "Good evening over there.";
    return "It's late for you. Rest soon.";
  }
  function tickClocks(){
    $('youTime').textContent = fmt(C.you.timezone);
    $('youMeta').textContent = dayLabel(C.you.timezone);
    $('himTime').textContent = fmt(C.him.timezone);
    $('himMeta').textContent = dayLabel(C.him.timezone);
    $('himGreet').textContent = greetFor(hourIn(C.him.timezone));
  }
  function startClocks(){ tickClocks(); setInterval(tickClocks,1000); }

  /* ---------- distance (haversine) ---------- */
  function showDistance(){
    const R=6371, toRad=d=>d*Math.PI/180;
    const dLat=toRad(C.him.lat-C.you.lat), dLng=toRad(C.him.lng-C.you.lng);
    const a=Math.sin(dLat/2)**2 + Math.cos(toRad(C.you.lat))*Math.cos(toRad(C.him.lat))*Math.sin(dLng/2)**2;
    const km=Math.round(2*R*Math.asin(Math.sqrt(a)));
    const mi=Math.round(km*0.621371);
    $('km').innerHTML = km.toLocaleString()+' km <small>&middot; '+mi.toLocaleString()+' mi apart</small>';
  }

  /* ---------- countdown ---------- */
  function startCountdown(){
    const target = new Date(C.meetup.target).getTime();
    function tick(){
      const diff = target - Date.now();
      if(diff<=0){
        $('cd').style.display='none';
        $('cdSay').textContent = C.meetup.over;
        return;
      }
      const d=Math.floor(diff/86400000);
      const h=Math.floor(diff%86400000/3600000);
      const m=Math.floor(diff%3600000/60000);
      const s=Math.floor(diff%60000/1000);
      $('cd-d').textContent=d; $('cd-h').textContent=h;
      $('cd-m').textContent=String(m).padStart(2,'0');
      $('cd-s').textContent=String(s).padStart(2,'0');
    }
    tick(); setInterval(tick,1000);
  }

  /* ---------- heart easter egg (点 5 下爱心) ---------- */
  let clicks=0, timer=null;
  $('heart').addEventListener('click', ()=>{
    clicks++;
    clearTimeout(timer);
    timer=setTimeout(()=>clicks=0, 1500);
    if(clicks>=5){ clicks=0; rainHearts(); }
  });
  function rainHearts(){
    if(reduce) return;
    const colors=['#C9ADA7','#A3B18A','#B08968','#9DA9B0'];
    for(let i=0;i<16;i++){
      const s=document.createElement('div');
      s.className='floater'; s.textContent='\u2665';
      s.style.left=Math.random()*100+'vw';
      s.style.color=colors[i%4];
      s.style.animationDelay=(Math.random()*0.8)+'s';
      s.style.fontSize=(16+Math.random()*18)+'px';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),4200);
    }
  }

  /* initial watch for hero + gate1 */
  watch();
})();
</script>
</body>
</html>
